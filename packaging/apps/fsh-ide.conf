# fsh-ide: the editor and debugger for fsh scripts (Swing)
NAME=fsh-ide
TITLE="fsh IDE"
# (the name in the macOS menu bar: 15 characters at most)
MAC_NAME="fsh IDE"
DESCRIPTION="fsh-ide, the editor and debugger for fsh and bash scripts"
MODULE=fsh-ide
KIND=gui
# COMMAND=MAIN-CLASS: the first is the installer's main launcher
LAUNCHERS="fsh-ide=us.bringardner.fsh.ide.FshIDE"
# (set for JavaFX's jars, which were for the platform they were built on; left as it was when the
# JavaFX IDE went, so the archives keep their names)
PLATFORM_JARS=yes
ICON=parley-icon-terminal
JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
# (the same for every version, so a newer Windows installer replaces an older one)
UPGRADE_UUID=6f1e8f1c-3a0b-5c55-9a4e-2d4f0b8a1c01
