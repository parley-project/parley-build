# parley-servers: the Parley servers, run as system services (Linux: systemd)
NAME=parley-servers
TITLE="Parley servers"
DESCRIPTION="The Parley servers: DNS, FTP, SSH (with SFTP), and the mail servers (SMTP, submission, IMAP, POP3, and FTP for the mail users) in one service, as systemd services (Linux) or launchd daemons (macOS)"
KIND=servers
# NAME:MODULES:MAIN-CLASS:SETTINGS-FILE-PROPERTY (the settings file is /etc/parley/parley-NAME.properties;
# the mail servers are parley-net's launcher, which runs those parley.servers lists)
# (the mail service has parley-ftp for its ftp and ftps servers, which are parley-mail's: parley-mail
# depends on parley-ftp only optionally, so it is named here)
SERVERS="dns:parley-dns:us.bringardner.parley.dns.server.DnsServer:parley.dns.configFile
ftp:parley-ftp:us.bringardner.parley.ftp.server.FtpServer:parley.ftp.configFile
ssh:parley-ssh:us.bringardner.parley.ssh.server.SshServer:parley.ssh.configFile
mail:parley-smtp parley-imap parley-pop3 parley-ftp:us.bringardner.parley.net.server.ServerMain:parley.servers.configFile"
# also on the class path: fsh, the SSH server's login shell, and parley-files-jdbc, the file system
# in a database, for a mail store several servers share (parley.mail.fileSource=jdbc; MySQL's
# driver comes with parley-dns, another database's goes in lib)
EXTRA_MODULES="fsh parley-files-jdbc"
PLATFORM_JARS=no
JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
