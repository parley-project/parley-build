# parley-servers: the Parley servers, run as system services (Linux: systemd)
NAME=parley-servers
TITLE="Parley servers"
DESCRIPTION="The Parley servers: DNS, FTP, SSH (with SFTP), POP3, IMAP and SMTP, as systemd services"
KIND=servers
# NAME:MODULE:MAIN-CLASS:SETTINGS-FILE-PROPERTY (the settings file is /etc/parley/parley-NAME.properties)
SERVERS="dns:parley-dns:us.bringardner.parley.dns.server.DnsServer:parley.dns.configFile
ftp:parley-ftp:us.bringardner.parley.ftp.server.FtpServer:parley.ftp.configFile
ssh:parley-ssh:us.bringardner.parley.ssh.server.SshServer:parley.ssh.configFile
pop3:parley-pop3:us.bringardner.parley.pop3.server.Pop3Server:parley.mail.pop3.configFile
imap:parley-imap:us.bringardner.parley.imap.server.ImapServer:parley.mail.imap.configFile
smtp:parley-smtp:us.bringardner.parley.smtp.server.SmtpServer:parley.mail.smtp.configFile"
# also on the class path: fsh, the SSH server's login shell
EXTRA_MODULES="fsh"
PLATFORM_JARS=no
JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
