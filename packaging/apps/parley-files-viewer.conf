# parley-files-viewer: the file browser for any FileSource (Swing)
NAME=parley-files-viewer
TITLE="Parley Files Viewer"
# (the name in the macOS menu bar: 15 characters at most)
MAC_NAME="Files Viewer"
DESCRIPTION="Parley Files Viewer, a two-pane file browser for the local disk, FTP, SFTP and databases"
MODULE=parley-files-viewer
KIND=gui
LAUNCHERS="parley-files-viewer=us.bringardner.parley.files.viewer.FileSourceViewer"
# (set for JavaFX's jars; left as it was when the JavaFX viewer went, as fsh-ide's)
PLATFORM_JARS=yes
ICON=parley-icon-files
JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
UPGRADE_UUID=0b7c9d2e-41f6-5e8a-b3c4-7a9d1e2f3c02
