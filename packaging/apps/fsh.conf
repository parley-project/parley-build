# fsh: the shell built on FileSource. Its installers are made by its own scripts (fsh's tools/,
# with its keyboard library and fshexec); the plain archive here, like the others. fsh is a
# command, not a desktop application: its installers put fsh, and fshdb with it, on PATH, and
# make no application or menu entry (macOS: a .pkg, as pfv's and pssh's).
NAME=fsh
TITLE="fsh, the FileSource Shell"
DESCRIPTION="fsh, a bash-compatible shell on any parley-files file system (the local disk, FTP, SFTP, a database)"
MODULE=parley-fsh
KIND=cli
LAUNCHERS="fsh=us.bringardner.fsh.Console"
PLATFORM_JARS=no
JAVA_OPTIONS="-Xss16m --enable-native-access=ALL-UNNAMED"
# installers: fsh's tools/build-jlink.sh, build-linux-packages.sh, build-macos-pkg.sh, build-msi.ps1
INSTALLER=fsh-tools
