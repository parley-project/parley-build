# fsh: the shell built on FileSource. Its installers are made by its own scripts (fsh's tools/,
# with its keyboard library and fshexec); the plain archive here, like the others.
NAME=fsh
TITLE="fsh, the FileSource Shell"
DESCRIPTION="fsh, a bash-compatible shell on any parley-files file system (the local disk, FTP, SFTP, a database)"
MODULE=fsh
KIND=cli
LAUNCHERS="fsh=us.bringardner.fsh.Console"
PLATFORM_JARS=no
JAVA_OPTIONS="-Xss16m --enable-native-access=ALL-UNNAMED"
# installers: fsh's tools/build-jlink.sh, build-linux-packages.sh, build-jpackage.sh, build-msi.ps1
INSTALLER=fsh-tools
