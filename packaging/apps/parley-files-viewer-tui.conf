# parley-files-viewer-tui: the terminal file browser, pfv, which is also fsh's browse plugin
NAME=parley-files-viewer-tui
TITLE="Parley Files Viewer (terminal)"
DESCRIPTION="pfv, the full-screen terminal file browser for any FileSource; with fsh, its browse, view, edit and search commands"
MODULE=parley-files-viewer-tui/parley-files-viewer-tui
KIND=cli
LAUNCHERS="pfv=us.bringardner.parley.files.viewer.tui.termui.TermMain"
PLATFORM_JARS=no
ICON=parley-icon-files
JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
# the jar is fsh's plugin: the installers link it into fsh's system plugin folder
FSH_PLUGIN=yes
UPGRADE_UUID=3d5e7f90-2b4c-5d6e-8f01-a2b3c4d5e603
