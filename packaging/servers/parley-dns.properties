# The DNS server's settings, read by /opt/parley/servers/bin/parley-dns (the systemd service parley-dns).
# Every setting is documented in parley-dns's README:
#   https://github.com/parley-project/parley-dns
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

# The folder of the zone and other files (made by the package, owned by parley)
parley.dns.dnsDir=/etc/parley/dns
# The zone files (made by the package, owned by parley): one <zone>.txt per zone. The primary
# domain's zone is made by hand; another domain's zone, when it has records of its own, has a
# "$INHERIT" line and serves the shared zone's records too (parley-mail-admin's DNS page makes those)
parley.dns.zoneDir=/etc/parley/dns/zones
# The shared zone: a zone file written with relative names (@ is the domain), served under the name
# of every listed domain. Made by hand; not a *.txt file in the zones folder. Without it the listed
# domains aren't served
#parley.dns.sharedZone=/etc/parley/dns/shared.zone
# The listed domains: the mail queue's domains (which parley-mail-admin's Domains page edits), so mail
# and DNS share one list. Each one with no zone file is served from the shared zone; its zone file is
# written when one of its records is changed on the DNS page
parley.dns.domainList.file=/var/lib/parley/mail/.smtp-queue/queue.properties
# The primary domain's zone (required): it serves the listed domains' DMARC report authorizations
#parley.dns.masterZone=example.com
#parley.dns.port=53
# The address it listens on (UDP and TCP; default: loopback only). On a machine whose own resolver
# listens on 127.0.0.53 (systemd-resolved), give the machine's address, not 0.0.0.0
#parley.dns.bindAddress=192.0.2.10

# An authoritative server only: it doesn't resolve other names for anyone who asks (an open
# resolver is used for attacks)
parley.dns.recursionAvailable=false

# Dynamic updates (RFC 2136): signed with the key parley-servers-setup made in admin.key, which
# parley-mail-admin's DNS page uses (parley.mail.admin.dnsKeyFile)
parley.dns.tsigKeyFile=admin.key
parley.dns.updateKeys=parley-admin
