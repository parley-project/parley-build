# The SSH server's settings, read by /opt/parley/servers/bin/parley-ssh (the systemd service parley-ssh).
# Every setting is documented in parley-ssh's README:
#   https://github.com/parley-project/parley-ssh
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

# Port 22 by default. While OpenSSH's sshd still runs on this machine, give one of them another
# port, e.g.
#parley.ssh.port=2222
# Host keys are made the first time in /etc/parley/ssh. Users log in with their
# ~/.ssh/authorized_keys under the homes folder, a certificate from the CAs in
# /etc/parley/ssh/trusted_user_ca_keys, or a password through an access control list:
#parley.ssh.homes=/home
#parley.ssh.authenticationProvider=us.bringardner.parley.net.server.FileBasedAcl
# Every session runs as the service's account (parley), whoever logged in.
