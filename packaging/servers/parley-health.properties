# parley-health: the checks bin/parley-health makes (the systemd timer parley-health.timer runs it
# every 5 minutes once enabled: systemctl enable --now parley-health.timer). It mails an alert when
# the state changes: a problem found, or every problem gone. Every run is in the journal
# (journalctl -u parley-health). This file is kept when the package is upgraded or removed.

# Who gets the alerts (comma separated; empty: only the journal) and who they are from. Use an
# address on another server: one on this server is no use when this server is the problem.
# (parley-servers-setup --alert-to ADDRESS --alert-from ADDRESS sets these.)
#parley.health.alertTo=admin@example.org
#parley.health.alertFrom=postmaster@example.com
# The SMTP server that sends them: this machine's relay (it lets 127.0.0.1 relay)
#parley.health.smtp=127.0.0.1:25

# The name in the alerts' subject (default: the machine's name)
#parley.health.name=mx1.example.com

# The systemd units that must be active, and the ports that must answer on this machine
parley.health.services=parley-mail
parley.health.ports=25,587,143,110

# Alert when a file system (the mail root's, the logs') is this full (percent)
#parley.health.diskPercent=80
# Alert when a message has waited in the SMTP queue this long (minutes)
#parley.health.queueMinutes=60
# The port whose certificate to check (empty: none), and how many days before it expires to alert
#parley.health.certPort=993
#parley.health.certDays=30
