# The Parley mail servers' shared settings, read by /opt/parley/servers/bin/parley-mail (the
# systemd service parley-mail) before each protocol's own file in this folder
# (parley-smtp.properties, parley-imap.properties, parley-pop3.properties, which win for their
# servers). parley-mail-admin edits these files too. Every setting is documented in the READMEs of
# parley-mail, parley-smtp, parley-imap and parley-pop3: https://github.com/parley-project
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

# The servers this process runs (parley-net's launcher), each on its own port (the standard one
# unless its file sets it): leave a server out of this list to turn it off. The implicit TLS ones
# (submissions 465, imaps 993, pop3s 995, ftps 990) are skipped with a warning until there is a key
# store (parley.mail.tls.keyStore below). parley-mail-admin turns servers on and off by editing this
# list (the parley-mail service reads it again when the admin reloads it). ftp and ftps give the mail users FTP in the mail store (see parley-mail-ftp.properties); run either
# them or the separate parley-ftp service on port 21, not both
parley.servers=smtp,submission,submissions,imap,imaps,pop3,pop3s,ftp,ftps

# ---------------------------------------------------------------- store, users, TLS

# The mail store (one folder per user, the SMTP queue and its history). The store carries its own
# settings, in .parley-store.properties in this folder (parley-servers-setup makes it with
# sharing=host: the servers this process runs are several servers on one store)
parley.mail.root=/var/lib/parley/mail

# The users (name , password-hash , READ|WRITE|ADMIN , maildrop=...): read again when it changes
parley.mail.users=/etc/parley/users.txt

# The key store of every server without one of its own (needed for STARTTLS and the implicit TLS servers)
#parley.mail.tls.keyStore=/etc/parley/tls/keystore.p12
#parley.mail.tls.keyStorePassword=
#parley.mail.tls.keyStoreType=PKCS12

# ---------------------------------------------------------------- logging

# The servers' log (parley-mail-admin's Logs page shows it); rotated at parley.log.fileMaxSize.
# parley.log.level is every logger's level; parley.log.level.<module> one module's, e.g.
# parley.log.level.smtp=DEBUG (parley-core's README)
parley.log.file=/var/log/parley/parley-mail.log
parley.log.fileMaxSize=10M
parley.log.level=INFO

# ---------------------------------------------------------------- parley-mail-admin

# Where parley-mail-admin finds these servers: this process's JMX (parley-mail.jvm), with the
# password the package made (the servers ignore these settings)
parley.mail.admin.jmxUrl=service:jmx:rmi:///jndi/rmi://127.0.0.1:9010/jmxrmi
parley.mail.admin.jmxUser=parleyadmin
parley.mail.admin.jmxPasswordFile=/etc/parley/jmx/admin.password
# With the parley-dns service too (its JMX is 127.0.0.1:9011, parley-dns.jvm): add its address,
# and the key the DNS page signs record changes with
#parley.mail.admin.jmxUrl=service:jmx:rmi:///jndi/rmi://127.0.0.1:9010/jmxrmi,service:jmx:rmi:///jndi/rmi://127.0.0.1:9011/jmxrmi
#parley.mail.admin.dnsKeyFile=/etc/parley/dns/admin.key
