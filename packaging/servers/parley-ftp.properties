# The FTP server's settings, read by /opt/parley/servers/bin/parley-ftp (the systemd service parley-ftp).
# Every setting is documented in parley-ftp's README:
#   https://github.com/parley-project/parley-ftp
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

# The folder FTP users see (made by the package, owned by parley)
parley.ftp.root=/var/lib/parley/ftp
#parley.ftp.port=21
# Users, passwords and permissions: an access control list, e.g.
#parley.ftp.authenticationProvider=us.bringardner.parley.net.server.FileBasedAcl
