# The IMAP server's settings, read by /opt/parley/servers/bin/parley-imap (the systemd service parley-imap).
# Every setting is documented in parley-imap's README:
#   https://github.com/parley-project/parley-imap
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

# The mail store POP3, IMAP and SMTP share: keep it the same in parley-pop3, parley-imap and
# parley-smtp.properties (made by the package, owned by parley)
parley.mail.root=/var/lib/parley/mail
# POP3, IMAP and SMTP each run as a service of their own, so they share the store on this
# machine (off: one server process only; cluster: servers on several machines)
parley.mail.sharedStore=host
#parley.mail.imap.port=143
#parley.mail.imap.authenticationProvider=us.bringardner.parley.net.server.FileBasedAcl
