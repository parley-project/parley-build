# The IMAP servers' own settings (imap, imaps), read by /opt/parley/servers/bin/parley-mail
# (the systemd service parley-mail) after parley-mail.properties: a setting here wins over that
# file for these servers. Every setting is documented in parley-imap's README:
#   https://github.com/parley-project/parley-imap
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

#parley.mail.imap.port=143
#parley.mail.imaps.port=993
