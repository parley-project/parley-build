# The POP3 servers' own settings (pop3, pop3s), read by /opt/parley/servers/bin/parley-mail
# (the systemd service parley-mail) after parley-mail.properties: a setting here wins over that
# file for these servers. Every setting is documented in parley-pop3's README:
#   https://github.com/parley-project/parley-pop3
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

#parley.mail.pop3.port=110
#parley.mail.pop3s.port=995
