# The SMTP servers' own settings (smtp, submission, submissions), read by /opt/parley/servers/bin/parley-mail
# (the systemd service parley-mail) after parley-mail.properties: a setting here wins over that
# file for these servers. Every setting is documented in parley-smtp's README:
#   https://github.com/parley-project/parley-smtp
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

#parley.mail.smtp.port=25
#parley.mail.submission.port=587
#parley.mail.submissions.port=465

# The name in the greeting, EHLO and Received fields (the PTR record of the server's address)
#parley.mail.smtp.hostname=mail.example.com
# Domains whose mail is delivered here (comma separated); parley-mail-admin's Domains page sets it
#parley.mail.smtp.domains=example.com
# Clients that may send to other domains without logging in
parley.mail.smtp.relayNetworks=127.0.0.1/32
# alias: member, member ...; parley-mail-admin's Aliases page edits it
parley.mail.smtp.aliases=/etc/parley/aliases.txt
