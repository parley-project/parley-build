# The SMTP servers' own settings (smtp, submission, submissions), read by /opt/parley/servers/bin/parley-mail
# (the systemd service parley-mail) after parley-mail.properties: a setting here wins over that
# file for these servers. Every setting is documented in parley-smtp's README:
#   https://github.com/parley-project/parley-smtp
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

#parley.mail.smtp.port=25
#parley.mail.submission.port=587
#parley.mail.submissions.port=465

# Each server's name in its greeting and Received fields (the PTR record of its address): required,
# a server without one doesn't start (parley-servers-setup --hostname sets all three)
#parley.mail.smtp.hostname=mail.example.com
#parley.mail.submission.hostname=mail.example.com
#parley.mail.submissions.hostname=mail.example.com
# Clients that may send to other domains without logging in (the relay's)
parley.mail.smtp.relayNetworks=127.0.0.1/32

# The queue the three servers share (default .smtp-queue under parley.mail.root) carries its own
# settings, in queue.properties in its folder: its hostname, the local domains, the aliases file,
# the smart host, DKIM keys and the rest of delivery (parley-smtp's README, "Queue settings").
# parley-servers-setup makes it.
