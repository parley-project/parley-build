# The FTP servers' own settings (ftp, ftps), read by /opt/parley/servers/bin/parley-mail
# (the systemd service parley-mail) after parley-mail.properties: a setting here wins over that
# file for these servers.
#
# FTP here is the mail suite's: the users, the local domains and the store are the mail servers'.
#   - Log in as name@domain with the mail password (the users file, parley.mail.users); the domain
#     must be one of the local domains (Domains page of parley-mail-admin).
#   - Each user sees only their own folder, <store>/.ftp/<domain>/<name>, in the same file system as
#     the mail (parley.mail.root, parley.mail.fileSource), and the users file's READ, WRITE and
#     ADMIN permissions apply.
#   - Logins need TLS (AUTH TLS, or the ftps port): the mail passwords are never sent in the clear.
#     That needs the key store in parley-mail.properties (parley.mail.tls.keyStore).
# This file is kept when the package is upgraded or removed (remove it with the package's purge).

#parley.mail.ftp.port=21
# Implicit TLS (usually 990): off until it has a port and a key store
#parley.mail.ftps.port=990

# The folder under the mail root that holds the users' folders (hidden: it is no maildrop)
#parley.mail.ftp.root=.ftp

# Passive mode: the ports for data connections (open them in the firewall), and the public address
# the replies name when the server is behind address translation (a cloud host: its public address)
#parley.mail.ftp.passiveMinPort=50000
#parley.mail.ftp.passiveMaxPort=50100
#parley.mail.ftp.externalAddress=203.0.113.10
